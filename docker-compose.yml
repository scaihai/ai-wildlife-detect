services:
  
  # 1. Web App Frontend (Flask)
  wildlife-detect-frontend:
    build: ./frontend
    image: frontend
    ports:
      - "5000:5000"
    environment:
      - GRAFANA_URL=https://grafana.enkwadore.com/d/ads2txc/tf-serving-metrics?orgId=1&from=now-6h&to=now&timezone=browser
    depends_on:
      - model-server
    networks:
      - mlops-net

  # 2. Model Server (TensorFlow Serving)
  model-server:
    image: tensorflow/serving:latest
    ports:
      - "8500:8500" # gRPC port
      - "8501:8501" # REST port
    environment:
      - MODEL_NAME=my_frcnn
      - MODEL_BASE_PATH=/model-registry
    volumes:
      # Maps the shared model registry volume to TF Serving
      - ./model-registry:/model-registry
    command:
      # Start TF Serving with the monitoring config file
      - "--monitoring_config_file=/model-registry/prometheus.conf"
    networks:
      - mlops-net

# 3. Training Pipeline
  training-pipeline:
    build: ./training-pipeline
    image: training-pipeline
    environment:
      - ADMIN_PASSWORD=2E=v[W,kj_}NP.Z2
    volumes:
      # Maps the local folder to /model-registry inside the container
      - ./model-registry:/model-registry
    networks:
      - mlops-net

networks:
  mlops-net:
    external: true